name: validate-hunts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Hunt Card integrity + link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Hunt Cards (structure, metadata sync, ATT&CK mapping, deploy JSON)
        run: python3 tools/validate-hunts.py

      - name: Check internal Markdown links resolve
        shell: python
        run: |
          import os, re, sys

          repo = os.getcwd()
          md_files = []
          for root, _, files in os.walk(repo):
              if ".git" in root:
                  continue
              for fn in files:
                  if fn.endswith(".md"):
                      md_files.append(os.path.join(root, fn))

          link_re = re.compile(r"\[[^\]]+\]\(([^)]+)\)")
          broken = []
          for f in md_files:
              base = os.path.dirname(f)
              text = open(f, encoding="utf-8").read()
              for m in link_re.finditer(text):
                  target = m.group(1).strip()
                  # skip external, anchors, mailto
                  if target.startswith(("http://", "https://", "#", "mailto:")):
                      continue
                  # strip in-page anchor from a file link
                  path_part = target.split("#", 1)[0]
                  if not path_part:
                      continue
                  resolved = os.path.normpath(os.path.join(base, path_part))
                  if not os.path.exists(resolved):
                      rel = os.path.relpath(f, repo)
                      broken.append(f"{rel} -> {target}")

          if broken:
              print(f"FAIL - {len(broken)} broken internal link(s):")
              for b in broken:
                  print(f"  - {b}")
              sys.exit(1)
          print(f"OK: all internal Markdown links resolve ({len(md_files)} files scanned).")

      - name: Validate ARM templates parse as JSON
        shell: python
        run: |
          import json, glob, sys
          bad = []
          for p in glob.glob("deploy/*.json"):
              try:
                  json.load(open(p, encoding="utf-8"))
              except json.JSONDecodeError as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("FAIL - invalid JSON:")
              for b in bad:
                  print(f"  - {b}")
              sys.exit(1)
          print("OK: all deploy/*.json valid.")
